<meta charset="utf-8">
<title>Bet Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Martian+Mono:wght@400;600&display=swap">
<style>
/* Layout: one quiet column like a bet slip. Every bet is one line (chance, odds, payout);
   tap it to open its details. Single committed dark look (the user's choice). */
:root {
  color-scheme: dark;
  --bg: #0e1116;
  --surface: #151a21;
  --raise: #1c232c;
  --line: #262e39;
  --fg: #e8ecf1;
  --muted: #8d97a4;
  --faint: #5e6773;
  --accent: #8fb0ff;
  --good: #3cc57f;
  --warn: #e6a93b;
  --bad: #f06a63;
  --sans: "Figtree", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "Martian Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.45; padding-bottom: 32px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.in { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

/* Header: name, league, games and bet type, then the sections. */
.hd { background: var(--surface); border-bottom: 1px solid var(--line); }
.hd .in { display: grid; gap: 12px; padding-block: 16px 0; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.brand { font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin: 0; }
.owner { font-size: 12px; color: var(--faint); }
.upd { margin-left: auto; font-size: 12px; color: var(--muted); }
.upd b { color: var(--fg); font-weight: 500; }
.leagues { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.leagues button { flex: none; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 5px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
.leagues button[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.pickers { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.pickers label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); min-width: 0; }
select, input[type="search"] { background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 14px; max-width: 100%; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-top: 2px; }
.tabs button { flex: none; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); padding: 8px 10px 10px; font-weight: 600; font-size: 14px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs .n { font-weight: 500; color: var(--faint); margin-left: 4px; font-size: 12px; }

main { display: grid; gap: 14px; padding-block: 18px; }
.lead { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 68ch; }
.notes { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.notes li { display: flex; gap: 8px; }
.notes li::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; margin-top: 7px; background: var(--faint); }
.notes li.ok::before { background: var(--good); }
.notes li.alert::before { background: var(--warn); }
.empty { color: var(--muted); padding: 20px 4px; font-size: 14px; }

/* A list of bets: a header line, then one row per bet that opens to show its details. */
.list { border-top: 1px solid var(--line); }
.cols { display: grid; grid-template-columns: 26px minmax(0, 1fr) 30px 52px 86px; gap: 10px; align-items: center; }
.th { font-size: 17px; text-align: center; line-height: 1; }
.th.down { filter: grayscale(1); opacity: .55; }
.lh { padding: 8px 0; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); border-bottom: 1px solid var(--line); }
.r { text-align: right; }
.bet { border-bottom: 1px solid var(--line); }
.bet > summary { list-style: none; cursor: pointer; padding: 11px 0; }
.bet > summary::-webkit-details-marker { display: none; }
.bet > summary:hover .t { color: var(--accent); }
.bet[open] > summary { padding-bottom: 6px; }
.idx { font-size: 12px; color: var(--faint); }
.what { min-width: 0; }
.t { font-weight: 600; overflow-wrap: anywhere; }
.s { display: block; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 4px; margin-left: 6px; border: 1px solid currentColor; vertical-align: 1px; line-height: 16px; }
.tag.warn { color: var(--warn); }
.tag.bad { color: var(--bad); }
.tag.ok { color: var(--good); }
.p { font-size: 15px; font-weight: 600; }
.o { font-size: 13px; }
.o small { display: block; font-family: var(--sans); font-size: 12px; color: var(--muted); letter-spacing: 0; }
.more { margin: 0 0 12px 36px; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
.more li { overflow-wrap: anywhere; }
.more .leg { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; color: var(--fg); padding: 3px 0; border-bottom: 1px dashed var(--line); }
.more .leg small { display: block; color: var(--muted); font-size: 12px; }
.c-good { color: var(--good); } .c-warn { color: var(--warn); } .c-bad { color: var(--bad); } .c-accent { color: var(--accent); } .c-muted { color: var(--muted); }
@media (max-width: 480px) { .cols { grid-template-columns: 18px minmax(0, 1fr) 24px 42px 76px; gap: 7px; } .more { margin-left: 26px; } .th { font-size: 15px; } }

/* "What the numbers mean": collapsed until asked for. */
.help { font-size: 13px; color: var(--muted); }
.help > summary { cursor: pointer; color: var(--accent); width: fit-content; }
.help dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 10px 0; }
.help dt { color: var(--fg); font-weight: 600; }
.help dd { margin: 0; }
.help p { margin: 6px 0 0; max-width: 72ch; }

/* Injuries */
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tools input { flex: 1 1 220px; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--raise); color: var(--fg); border-color: var(--faint); }
.ig h3 { margin: 6px 0 4px; font-size: 14px; font-weight: 700; }
.ig h3 small { font-weight: 500; color: var(--muted); margin-left: 6px; }
.inj { display: grid; grid-template-columns: 88px minmax(0, 1fr) minmax(0, auto); gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
.inj .st { font-size: 12px; font-weight: 600; }
.inj small { color: var(--muted); }
.inj .why { color: var(--muted); font-size: 13px; text-align: right; }
@media (max-width: 480px) { .inj { grid-template-columns: 78px minmax(0, 1fr); } .inj .why { grid-column: 2; text-align: left; } }

/* Bet History */
.rec { display: grid; gap: 8px; }
.tally { font-size: 15px; }
.tally b { font-family: var(--mono); font-weight: 600; }
.wl { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); }
.wl b { color: var(--fg); font-weight: 600; }
.bar { height: 6px; border-radius: 3px; background: var(--bad); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--good); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters input { flex: 1 1 220px; }
.link { border: 0; background: transparent; color: var(--accent); cursor: pointer; font-size: 13px; padding: 4px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--accent); }
.dd { border-top: 1px solid var(--line); }
.dd:last-of-type { border-bottom: 1px solid var(--line); }
.dd > summary { list-style: none; cursor: pointer; padding: 11px 0; display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; }
.dd > summary::-webkit-details-marker { display: none; }
.dd > summary::before { content: "+"; font-family: var(--mono); color: var(--faint); width: 12px; }
.dd[open] > summary::before { content: "−"; }
.dd > summary b { font-weight: 600; }
.dd > summary span { font-size: 12.5px; color: var(--muted); }
.ddb { padding: 0 0 12px 22px; display: grid; gap: 6px; }
.dd .dd > summary { padding: 8px 0; }
.wk { font-size: 12.5px; font-weight: 600; margin-top: 6px; }
.wk span { font-weight: 400; color: var(--muted); margin-left: 8px; }
.hrow { display: grid; grid-template-columns: 58px minmax(0, 1fr) 40px; gap: 10px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.res { font-size: 11px; font-weight: 600; letter-spacing: .05em; }
.r-won { color: var(--good); } .r-lost { color: var(--bad); } .r-push { color: var(--muted); } .r-pending { color: var(--accent); }
.hrow .t { font-weight: 500; }
.hrow .num { font-size: 12px; color: var(--muted); text-align: right; }
.rows3 { display: grid; gap: 4px; font-size: 13px; }
.rows3 i { font-style: normal; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-top: 6px; }
.rows3 div { display: grid; grid-template-columns: minmax(110px, 1.1fr) minmax(0, 1.4fr) minmax(0, 1.3fr); gap: 10px; color: var(--muted); }
.rows3 b { color: var(--fg); font-weight: 600; }
@media (max-width: 480px) { .rows3 div { grid-template-columns: 1fr 1fr; } .rows3 div span:last-child { grid-column: 1 / -1; } }
</style>

<header class="hd">
  <div class="in">
    <div class="top">
      <h1 class="brand">Bet Builder</h1>
      <span class="owner">Levi Shoaf</span>
      <span class="upd">Updated <b id="updated"></b></span>
    </div>
    <nav class="leagues" aria-label="League">
      <button id="sport-nfl" data-sport="nfl" aria-pressed="true">NFL</button>
      <button id="sport-ncaaf" data-sport="ncaaf" aria-pressed="false">College Football</button>
      <button id="sport-ufc" data-sport="ufc" aria-pressed="false">UFC</button>
      <button id="sport-mlb" data-sport="mlb" aria-pressed="false">MLB</button>
      <button id="sport-nba" data-sport="nba" aria-pressed="false">NBA</button>
    </nav>
    <div class="pickers">
      <label for="week">Games <select id="week"></select></label>
      <label for="btype">Bet type <select id="btype"></select></label>
    </div>
    <nav class="tabs" role="tablist" aria-label="Section">
      <button role="tab" id="tab-singles" data-tab="singles" aria-selected="true">Singles<span class="n" id="n-singles"></span></button>
      <button role="tab" id="tab-parlays" data-tab="parlays" aria-selected="false">Parlays<span class="n" id="n-parlays"></span></button>
      <button role="tab" id="tab-money" data-tab="money" aria-selected="false">Money Maker<span class="n" id="n-money"></span></button>
      <button role="tab" id="tab-multi" data-tab="multi" aria-selected="false">Multi-Lays<span class="n" id="n-multi"></span></button>
      <button role="tab" id="tab-value" data-tab="value" aria-selected="false">Value<span class="n" id="n-value"></span></button>
      <button role="tab" id="tab-injuries" data-tab="injuries" aria-selected="false">Injuries<span class="n" id="n-injuries"></span></button>
      <button role="tab" id="tab-history" data-tab="history" aria-selected="false">History<span class="n" id="n-history"></span></button>
    </nav>
  </div>
</header>

<main class="in" id="main"></main>

<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const TABS = ["singles", "parlays", "money", "multi", "value", "injuries", "history"];
  const state = {
    sport: store.get("bb.sport", "nfl"),
    week: {},
    tab: store.get("bb.tab", "singles"),
    betType: store.get("bb.type", "All bets"),
    injFilter: "all",
    injSearch: "",
    open: new Set()  // rows and dropdowns that are open, kept across redraws
  };
  if (!DATA[state.sport] || !DATA[state.sport].length) state.sport = "nfl";
  if (!TABS.includes(state.tab)) state.tab = "singles";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pct = (p) => Math.round(p * 100) + "%";
  const money = (x) => "$" + (x >= 1000 ? x.toLocaleString("en-US", { maximumFractionDigits: 0 }) : (Number.isInteger(x) ? String(x) : x.toFixed(2)));
  const WAGER = 10;  // every payout is shown for a $10 wager
  const amToDec = (a) => (a > 0 ? 1 + a / 100 : 1 + 100 / -a);
  const fmtAm = (a) => (a > 0 ? "+" : "") + a;
  const decToAm = (d) => (d >= 2 ? Math.round((d - 1) * 100) : Math.round(-100 / (d - 1)));
  const signPct = (x) => (x > 0 ? "+" : "") + (x * 100).toFixed(1) + "%";
  const chanceCls = (p) => (p >= 0.72 ? "c-good" : p >= 0.62 ? "" : "c-warn");
  const rateCls = (r) => (r >= 0.7 ? "c-good" : r >= 0.5 ? "c-warn" : "c-bad");
  const TIER_CLS = { green: "c-good", yellow: "c-warn", red: "c-bad" };
  const TIER_VAR = { green: "var(--good)", yellow: "var(--warn)", red: "var(--bad)" };
  const TIER_WORD = { green: "Strong", yellow: "Mixed", red: "Weak" };
  const LEAGUE_SHORT = { nfl: "NFL", ncaaf: "CFB", ufc: "UFC", mlb: "MLB", nba: "NBA" };

  function weekList() { return DATA[state.sport] || []; }
  function weekData() {
    const list = weekList();
    const w = state.week[state.sport];
    return list.find((x) => x.week === w) || list[0] || { singles: [], parlays: [], label: "" };
  }
  // The chosen week, with only the chosen bet type's singles and parlays.
  function current() {
    const wk = weekData();
    if (state.betType === "All bets") return wk;
    const t = (wk.types || {})[state.betType] || { singles: [], parlays: [], money: [] };
    return { ...wk, singles: t.singles, parlays: t.parlays, money: t.money || [] };
  }
  function typeOptions(wk) {
    const kinds = (DATA.leagueTypes || {})[state.sport] || DATA.betTypes || ["All bets"];
    return kinds.map((k) => {
      const has = k === "All bets" || (wk.types || {})[k];
      if (!has && state.sport === "ncaaf" && k !== state.betType) return "";  // college: moneylines only
      return `<option value="${esc(k)}"${k === state.betType ? " selected" : ""}${has ? "" : " disabled"}>${esc(k + (has ? "" : " (none this week)"))}</option>`;
    }).join("");
  }
  function emptyNote(fallback) {
    const k = state.betType;
    if (k === "All bets") return fallback;
    if (state.sport === "ncaaf" && k !== "Moneyline") return "College bets are moneylines only.";
    if (state.sport === "ufc") return `No ${k.toLowerCase()} bets on this card.`;
    if (state.sport === "nba") return ["Spread", "Total points"].includes(k) ? `No ${k.toLowerCase()} bets for this day: DraftKings hasn't posted lines yet.` : `No ${k.toLowerCase()} bets for this day.`;
    if (state.sport === "mlb") return k === "Total runs" ? "No total runs bets for this day: DraftKings hasn't posted totals yet." : `No ${k.toLowerCase()} bets for this day.`;
    return `No ${k.toLowerCase()} bets for this week.`;
  }

  // ---- what a bet's row says, and what it shows when opened
  function tags(note, confirm) {
    let html = "";
    if (confirm) html += '<span class="tag warn">Confirm line</span>';
    if (note === "Questionable") html += '<span class="tag warn">Q</span>';
    if (note === "Did not practice") html += '<span class="tag bad">DNP</span>';
    if (note === "No line yet") html += '<span class="tag warn">No line yet</span>';
    return html;
  }
  const tierDot = (b) => (b.tier ? `<span class="dot" style="background:${TIER_VAR[b.tier.tier]}" title="${esc(b.tier.word)}"></span>` : "");
  const legRec = (l) => { const h = l.hist; if (!h) return null; return h.now && h.now[1] ? h.now : h.last && h.last[1] ? h.last : null; };
  function tierItem(b) {
    const t = b.tier;
    if (!t) return "";
    const moved = Math.abs(t.shift || 0) >= 0.005 ? ` (${t.shift > 0 ? "+" : ""}${Math.round(t.shift * 100)} pts from tested signals)` : "";
    return `<li class="${TIER_CLS[t.tier]}">${esc(t.word)}: ${esc(t.reasons.join(", ") || "no strong signals either way")}${moved}</li>`;
  }
  function histItems(b) {
    const h = b.hist;
    if (!h) return "";
    const parts = [[h.now, "this season"], [h.last, "last season"]].filter(([r]) => r && r[1])
      .map(([r, w]) => `${r[0]} of ${r[1]} ${w} (${pct(r[0] / r[1])})`);
    const base = (h.now && h.now[1] >= 3) ? h.now : (h.last && h.last[1] >= 3 ? h.last : null);
    let html = parts.length ? `<li class="${base ? rateCls(base[0] / base[1]) : ""}">Won ${parts.join(" · ")}</li>` : "";
    if (h.h2h) {
      const m = h.h2h;
      html += m.n
        ? `<li class="${rateCls(m.w / m.n)}">Vs ${esc(m.opp)}: ${m.w}-${m.n - m.w} since ${m.since} (${esc(m.games.join(", "))})</li>`
        : `<li>Vs ${esc(m.opp)}: no games since ${m.since}</li>`;
    }
    return html;
  }
  function insightItems(b) {
    let html = "";
    if (b.raw != null && Math.abs(b.raw - b.prob) >= 0.02)
      html += `<li>Learned: the model said ${pct(b.raw)}; bets like this have really won about ${pct(b.prob)}, so that's the chance shown</li>`;
    if (b.tier) {
      html += b.tier.notes.map((n) => `<li>${esc(n)}</li>`).join("");
      html += b.tier.flags.map((f) => `<li class="c-warn">⚠ ${esc(f)}</li>`).join("");
    }
    return html;
  }
  // Real odds (with an Odds API key): FanDuel's price, its value and the best price elsewhere.
  function oddsItems(fd) {
    if (!fd) return "";
    let html = `<li class="${fd.ev > 0 ? "c-good" : ""}">FanDuel ${esc(fmtAm(fd.price))} · value ${signPct(fd.ev)} · true chance from ${fd.books} other book${fd.books === 1 ? "" : "s"}${fd.sharp ? " incl. Pinnacle" : ""}</li>`;
    if (fd.best > fd.price) html += `<li class="c-accent">Better price: ${esc(fmtAm(fd.best))} at ${esc(fd.bestBook)}</li>`;
    if (fd.check) html += `<li class="c-warn">⚠ Far from every other book: check the news (an injury or a stale line)</li>`;
    if (fd.rough) html += `<li>Rough: books post only Yes on this, so the chance is estimated</li>`;
    return html;
  }
  // One bet: a summary line that opens to its details. `key` keeps it open across redraws.
  // Thumbs up: worth betting at FanDuel's price. Thumbs down: not, or not sure (see picks.worth_it).
  const thumb = (w) => (w && w[0] ? "👍" : "👎");
  function worthItem(w) {
    if (!w) return "";
    return `<li class="${w[0] ? "c-good" : "c-muted"}">${thumb(w)} ${w[0] ? "Worth it" : "Not worth it"}: ${esc(w[1])}</li>`;
  }
  function row(key, idx, what, chance, odds, pays, details, worth) {
    const open = state.open.has(key) ? " open" : "";
    return `<details class="bet" data-dd="${esc(key)}"${open}><summary class="cols">
      <span class="idx num">${esc(idx)}</span>
      <span class="what">${what}</span>
      <span class="th${worth && worth[0] ? "" : " down"}" title="${esc(worth ? worth[1] : "Not rated")}" aria-label="${worth && worth[0] ? "Worth it" : "Not worth it"}">${thumb(worth)}</span>
      <span class="r p num ${chanceCls(chance)}">${pct(chance)}</span>
      <span class="r o num">${esc(odds)}<small>${pays}</small></span>
    </summary><ul class="more">${worthItem(worth)}${details || ""}</ul></details>`;
  }
  function listHead(odds = "Odds", pays = "pays on $10") {
    return `<div class="cols lh"><span>#</span><span>Bet</span><span title="Worth betting at FanDuel's price?">Bet?</span><span class="r">Chance</span><span class="r" title="${esc(pays)}">${esc(odds)}</span></div>`;
  }
  const paysAt = (b) => (b.fd ? WAGER * amToDec(b.fd.price) : WAGER / b.prob);
  function singleRow(b, i) {
    const what = `<span class="t">${tierDot(b)}${esc(b.label)}</span>${tags(b.note, b.confirm)}<span class="s">${esc(b.game)} · ${esc(b.when)} ET</span>`;
    const details = tierItem(b) + histItems(b) + insightItems(b) + oddsItems(b.fd);
    return row("s:" + (b.lid || b.id), i + 1, what, b.prob, b.fd ? fmtAm(b.fd.price) : b.breakeven, money(paysAt(b)),
      details || `<li>No track record for this bet yet.</li>`, b.worth);
  }
  // A parlay leg: its own chance and record.
  function legItem(l) {
    const r = legRec(l), m = l.hist && l.hist.h2h, bits = [];
    if (r) bits.push(`won ${r[0]} of ${r[1]}`);
    if (m && m.n) bits.push(`${m.w}-${m.n - m.w} vs ${m.opp.split(" ").pop()}`);
    let day = /, [A-Z][a-z]{2} \d+$/.test(l.game || "") ? l.game.split(", ").pop() : "";  // MLB: the day
    const sub = [l.league ? LEAGUE_SHORT[l.league] || l.league : "", l.game ? l.game.split(", ")[0] : "", day, l.fd ? "FanDuel " + fmtAm(l.fd.price) : "", ...bits].filter(Boolean).join(" · ");
    return `<li class="leg"><span>${tierDot(l)}${esc(l.label)}${tags(l.note, l.confirm)}<small>${esc(sub)}</small></span><span class="num ${chanceCls(l.prob)}">${pct(l.prob)}</span></li>`;
  }
  function parlayDetails(p, dec) {
    let html = p.legs.map(legItem).join("");
    const tiers = p.legs.map((l) => l.tier && l.tier.tier).filter(Boolean);
    if (tiers.length) {
      const worst = tiers.includes("red") ? "red" : tiers.includes("yellow") ? "yellow" : "green";
      const parts = ["green", "yellow", "red"].map((k) => [k, tiers.filter((t) => t === k).length]).filter(([, n]) => n).map(([k, n]) => `${n} ${TIER_WORD[k]}`);
      html += `<li class="${TIER_CLS[worst]}">Legs: ${parts.join(", ")}</li>`;
    }
    const w = p.legs.map((l) => [legRec(l), l]).filter(([r]) => r).sort((a, b) => a[0][0] / a[0][1] - b[0][0] / b[0][1])[0];
    if (w) html += `<li class="${rateCls(w[0][0] / w[0][1])}">Weakest leg: ${esc(w[1].label)} won ${w[0][0]} of ${w[0][1]} (${pct(w[0][0] / w[0][1])})</li>`;
    if (dec) html += `<li class="${p.prob * dec > 1 ? "c-good" : ""}">FanDuel ${esc(fmtAm(decToAm(dec)))} (the legs' prices multiplied; check the slip) · value ${signPct(p.prob * dec - 1)}</li>`;
    return html;
  }
  // A parlay's FanDuel payout per $1 when every leg has FanDuel's real price, else null.
  const fdDecimal = (p) => (p.legs.length && p.legs.every((l) => l.fd) ? p.legs.reduce((d, l) => d * amToDec(l.fd.price), 1) : null);
  function parlayRow(p, i, prefix, payBack) {
    const dec = fdDecimal(p);
    const back = dec || (payBack && p.back) || 1 / p.prob;
    const about = !dec && payBack ? "≈" : "";
    const leagues = prefix === "X" ? " · " + [...new Set(p.legs.map((l) => LEAGUE_SHORT[l.league] || ""))].sort().join(" + ") : "";
    const what = `<span class="t">${p.legs.length}-leg parlay${esc(leagues)}</span>${p.legs.some((l) => l.confirm) ? tags("", true) : ""}<span class="s">${p.legs.map((l) => esc(l.label)).join(" · ")}</span>`;
    return row(prefix + ":" + p.legs.map((l) => l.lid || l.id).join("|"), prefix + (i + 1), what, p.prob,
      dec ? fmtAm(decToAm(dec)) : p.breakeven, about + money(WAGER * back), parlayDetails(p, dec), p.worth);
  }

  // The Value tab: every FanDuel line in the league priced against every sportsbook.
  function valueView() {
    const offers = ((DATA.value || {})[state.sport]) || [];
    if (!offers.length) return `<p class="empty">Real odds aren't on for this league right now. With an Odds API key, every FanDuel line is priced against every sportsbook here.</p>`;
    const firm = offers.filter((o) => o.ev > 0 && !o.rough && !o.check).length;
    const better = offers.filter((o) => o.best > o.fanduel).length;
    const rows = offers.slice(0, 80).map((o, i) => {
      const what = `<span class="t">${esc(o.label)}</span>${o.check ? '<span class="tag warn">Check</span>' : ""}${o.rough ? '<span class="tag warn">Rough</span>' : ""}<span class="s">${esc(o.game)}</span>`;
      let details = `<li>${o.books} books${o.sharp ? " incl. Pinnacle" : ""} · value ${signPct(o.ev)} at FanDuel${o.best > o.fanduel ? ` · ${signPct(o.bestEv)} at ${esc(o.bestBook)}` : ""}</li>`;
      if (o.best > o.fanduel) details += `<li class="c-accent">Better price: ${esc(fmtAm(o.best))} at ${esc(o.bestBook)}</li>`;
      if (o.check) details += `<li class="c-warn">⚠ Far from every other book: check the news</li>`;
      if (o.rough) details += `<li>Rough: only Yes prices posted, so the chance is estimated</li>`;
      return row("v:" + o.eventId + "|" + o.label, i + 1, what, o.chance, fmtAm(o.fanduel),
        `<span class="${o.ev > 0 ? "c-good" : ""}">${signPct(o.ev)}</span>`, details, o.worth);
    }).join("");
    return `<p class="lead">${offers.length} FanDuel lines checked against every sportsbook: 👍 ${offers.filter((o) => o.worth && o.worth[0]).length} worth betting at FanDuel (value of +1% or more on a solid price), ${firm} with any value, and a better price at another US book on ${better}. Value is what $1 at FanDuel's price earns on average at the true chance (every book's price with its cut taken out, sharp books counting most). Best value first.</p>
      <div class="list">${listHead("FanDuel", "value")}${rows}</div>`;
  }

  // ---- injuries
  const SCLS = { Out: "c-bad", Doubtful: "c-bad", Questionable: "c-warn", "Did not practice": "c-warn", Limited: "c-muted" };
  function injuriesView(wk) {
    const inj = wk.injuries;
    if (!inj && state.sport === "mlb") return `<p class="empty">MLB: the probable starters are listed above the bets. A late pitching change moves the line, and the bets refresh with it.</p>`;
    if (!inj && state.sport === "nba") return `<p class="empty">NBA: player props on anyone listed Out or Day-To-Day on ESPN's injury report are left out. A star sitting moves the line, and the bets refresh with it.</p>`;
    if (!inj && state.sport === "ufc") return `<p class="empty">UFC: a fighter who pulls out drops off the card when ESPN updates it (checked every few hours), so check the final card after Friday's weigh-ins.</p>`;
    if (!inj) return `<p class="empty">Injury reports are for NFL games. Switch to NFL to see them.</p>`;
    let players = inj.players;
    if (state.injFilter === "game") players = players.filter((p) => ["Out", "Doubtful", "Questionable"].includes(p.status));
    if (state.injFilter === "out") players = players.filter((p) => ["Out", "Doubtful"].includes(p.status));
    const q = state.injSearch.trim().toLowerCase();
    if (q) players = players.filter((p) => (p.player + " " + p.team_name + " " + p.team + " " + p.injury).toLowerCase().includes(q));
    const games = new Map();
    for (const p of players) {
      const home = p.opponent.startsWith("vs") ? p.team : p.opponent.slice(2);
      const away = p.opponent.startsWith("vs") ? p.opponent.slice(3) : p.team;
      const key = away + " @ " + home;
      if (!games.has(key)) games.set(key, { kickoff: p.kickoff, rows: [] });
      games.get(key).rows.push(p);
    }
    const when = (iso) => new Date(iso).toLocaleString("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "2-digit" });
    const blocks = [...games.entries()].sort((a, b) => a[1].kickoff.localeCompare(b[1].kickoff)).map(([k, g]) => `
      <section class="ig"><h3>${esc(k)}<small>${esc(when(g.kickoff))} ET</small></h3>
      ${g.rows.map((p) => `<div class="inj"><span class="st ${SCLS[p.status] || "c-muted"}">${esc(p.status)}</span>
        <span><b>${esc(p.player)}</b> <small>${esc(p.position)} · ${esc(p.team)}${p.official ? " · official" : ""}</small></span>
        <span class="why">${esc(p.injury || "")}</span></div>`).join("")}</section>`).join("");
    return `<ul class="notes"><li>${esc(inj.note)}</li></ul>
      <div class="tools">
        <input id="injsearch" type="search" placeholder="Search player, team or injury" value="${esc(state.injSearch)}" aria-label="Search injuries">
        <button class="chip" data-inj="all" aria-pressed="${state.injFilter === "all"}">Everyone</button>
        <button class="chip" data-inj="game" aria-pressed="${state.injFilter === "game"}">Game statuses</button>
        <button class="chip" data-inj="out" aria-pressed="${state.injFilter === "out"}">Out or doubtful</button>
      </div>
      ${blocks || (state.injFilter !== "all" && !q && !inj.players.some((p) => p.official)
        ? `<p class="empty">No official game statuses yet. Out, Doubtful and Questionable come from the Friday injury report, which hadn't reached this data at the last update. Until then, use Everyone to see who missed or was limited in practice.</p>`
        : `<p class="empty">No players match.</p>`)}`;
  }

  // ---- bets the builder made (and ones placed here earlier), graded after the games
  const RESULTS = DATA.legResults || {};
  const HISTORY = DATA.history || [];
  const SAVED = DATA.saved || [];
  let db = null;
  state.placed = [];  // bets placed on this page earlier (they stay in Bet History)
  state.checks = {};
  state.dbState = "loading";
  function legStatus(lid) { return RESULTS[lid] || ["pending", ""]; }
  function entryStatus(legs) {
    const s = legs.map((l) => legStatus(l.lid)[0]);
    if (s.includes("lost")) return "lost";
    if (s.includes("pending")) return "pending";
    return s.every((x) => x === "push") ? "push" : "won";
  }
  function placedIds() { return new Set(state.placed.map((p) => p.entryId)); }
  function unplaced() { const ids = placedIds(); return HISTORY.filter((h) => !ids.has(h.id)); }
  function historyList(models = state.showModel) {  // [source, entry]: a pick you placed shows once, as placed
    const ids = placedIds();
    const keep = (e) => models || !e.model;  // model-made lines only when asked
    return state.placed.map((e) => ["Placed", e])
      .concat(unplaced().filter(keep).map((e) => ["Not placed", e]))
      .concat(SAVED.filter((e) => !ids.has(e.id) && keep(e)).map((e) => ["Saved earlier", e]));
  }
  const LEAGUES = [["nfl", "NFL"], ["ncaaf", "College football"], ["ufc", "UFC"], ["mlb", "MLB"], ["nba", "NBA"], ["multi", "Multi-Lays"]];
  const HF = { q: "", league: "all", result: "all", kind: "all", week: "all", type: "all" };
  // A leg's bet type, as the Bet type menu names it (nfl_edge/tracker.leg_type_name).
  const LEG_TYPES = { moneyline: "Moneyline", spread: "Spread", total: "Total points", team_total: "Team totals",
    fight: "Moneyline", distance: "Fight distance", run_line: "Run line" };
  const STAT_TYPES = { receiving_yards: "Receiving yards", receptions: "Receptions", rushing_yards: "Rushing yards",
    passing_yards: "Passing yards", passing_tds: "Passing TDs", "rushing_tds+receiving_tds": "Anytime TD" };
  function legType(l) {
    if (l.type) return l.type;
    const r = l.rec || {};
    return r.type === "player_stat" ? (STAT_TYPES[r.stat] || "Other props") : (LEG_TYPES[r.type] || "Other");
  }
  const typesOf = (e) => [...new Set(e.legs.map(legType))];
  state.hist = { ...HF };
  const histFiltered = () => Object.keys(HF).some((k) => state.hist[k] !== HF[k]);
  function dd(key, title, sub, body) {
    return `<details class="dd" data-dd="${esc(key)}"${state.open.has(key) ? " open" : ""}><summary><b>${esc(title)}</b><span>${esc(sub)}</span></summary><div class="ddb">${body}</div></details>`;
  }
  function historyView() {
    const all = historyList().map(([src, e]) => [src, e, entryStatus(e.legs)]);
    const record = historyList(false).map(([src, e]) => [src, e, entryStatus(e.legs)]);  // never model lines
    const count = (list) => { const c = { won: 0, lost: 0, push: 0, pending: 0 }; list.forEach(([, , s]) => { c[s]++; }); return c; };
    const tally = (list) => { const c = count(list); return `${c.won} won · ${c.lost} lost${c.push ? ` · ${c.push} pushed` : ""} · ${c.pending} pending`; };
    const bar = (sport, name) => {
      const g = record.filter(([, e]) => (e.sport || "nfl") === sport);
      const w = g.filter(([, , s]) => s === "won").length, l = g.filter(([, , s]) => s === "lost").length;
      if (w + l === 0) return `<div class="wl"><b>${name}</b><span>No settled bets yet</span><span></span></div>`;
      const p = Math.round(100 * w / (w + l));
      return `<div class="wl"><b>${name}</b><div class="bar"><span style="width:${p}%"></span></div><span class="num">${p}% · ${w}-${l}</span></div>`;
    };
    const first = (e) => e.legs.map((l) => l.kickoff || "9999").sort()[0];
    const weekOf = (e) => {
      if (e.week) return e.week;
      const ws = e.legs.map((l) => (DATA.gameWeeks || {})[(l.lid || "").split("|")[0]]).filter(Boolean);
      return ws.length ? Math.min(...ws) : null;
    };
    const teamOf = (e) => e.team || (e.kind !== "single" ? "Parlays" : (DATA.legTeams || {})[(e.legs[0] || {}).lid] || "Other");
    const leagueName = (k) => (LEAGUES.find(([x]) => x === k) || [k, k])[1];
    const c = count(record);

    let html = `<section class="rec"><div class="tally"><b class="c-good">${c.won}</b> won · <b class="c-bad">${c.lost}</b> lost${c.push ? ` · <b>${c.push}</b> pushed` : ""} · <b class="c-accent">${c.pending}</b> pending</div>
      ${bar("nfl", "NFL")}${bar("ncaaf", "College")}${bar("ufc", "UFC")}${bar("mlb", "MLB")}${bar("nba", "NBA")}</section>`;
    const h = state.hist;
    const weeks = [...new Set(all.map(([, e]) => weekOf(e)).filter(Boolean))].sort((a, b) => b - a);
    const kinds = [...new Set(all.flatMap(([, e]) => typesOf(e)))].sort();
    const opt = (v, label, cur) => `<option value="${esc(v)}"${String(cur) === String(v) ? " selected" : ""}>${esc(label)}</option>`;
    html += `<div class="filters">
      <input id="hsearch" type="search" placeholder="Search a team, player, bet type or week" value="${esc(h.q)}" aria-label="Search bet history">
      <select id="hf-league" data-hf="league" aria-label="League">${opt("all", "All leagues", h.league)}${LEAGUES.map(([k, n]) => opt(k, n, h.league)).join("")}</select>
      <select id="hf-result" data-hf="result" aria-label="Result">${[["all", "Any result"], ["won", "Won"], ["lost", "Lost"], ["push", "Pushed"], ["pending", "Pending"]].map(([k, n]) => opt(k, n, h.result)).join("")}</select>
      <select id="hf-kind" data-hf="kind" aria-label="Singles or parlays">${[["all", "Singles + parlays"], ["single", "Singles"], ["parlay", "Parlays"]].map(([k, n]) => opt(k, n, h.kind)).join("")}</select>
      <select id="hf-week" data-hf="week" aria-label="Week">${opt("all", "Any week", h.week)}${weeks.map((w) => opt(w, "Week " + w, h.week)).join("")}</select>
      <select id="hf-type" data-hf="type" aria-label="Bet type">${opt("all", "Any bet type", h.type)}${kinds.map((k) => opt(k, k, h.type)).join("")}</select>
      ${histFiltered() ? `<button class="link" data-hclear="1">Clear</button>` : ""}
    </div>
    <label class="check"><input type="checkbox" id="hmodel"${state.showModel ? " checked" : ""}> Show model lines (spreads, totals and "X+" props the model made up; FanDuel may not have offered them, so they're left out of the record)</label>`;

    if (histFiltered()) {  // one list of everything that matches, newest first
      const words = h.q.toLowerCase().split(/\s+/).filter(Boolean);
      const found = all.filter(([, e, s]) => {
        const sport = e.sport || "nfl";
        if (h.league !== "all" && sport !== h.league) return false;
        if (h.result !== "all" && s !== h.result) return false;
        if (h.kind !== "all" && (e.kind === "single" ? "single" : "parlay") !== h.kind) return false;
        if (h.week !== "all" && String(weekOf(e)) !== String(h.week)) return false;
        if (h.type !== "all" && !typesOf(e).includes(h.type)) return false;
        const text = [leagueName(sport), teamOf(e), e.kind, s, "week " + weekOf(e), ...typesOf(e),
          ...e.legs.map((l) => l.pick + " " + (l.game || ""))].join(" ").toLowerCase();
        return words.every((w) => text.includes(w));
      }).sort((a, b) => first(b[1]).localeCompare(first(a[1])));
      html += found.length
        ? `<p class="lead">${found.length} bet${found.length === 1 ? "" : "s"} found · ${tally(found)}</p><div>${found.slice(0, 200).map(([, e, s]) => histRow(e, s, [leagueName(e.sport || "nfl"), weekOf(e) ? "Week " + weekOf(e) : "", e.kind === "single" ? teamOf(e) : ""])).join("")}</div>${found.length > 200 ? `<p class="lead">Showing the newest 200. Narrow the search to see the rest.</p>` : ""}`
        : `<p class="empty">No bets match. Try fewer words, or clear the filters.</p>`;
      return html;
    }

    let groups = dd("card", "Model report card", "won vs the model's expected win rate", reportCardHtml());
    groups += dd("learned", "What the model has learned", "chances corrected by how bets like them really did", learnedHtml());
    for (const [sport, name] of LEAGUES) {
      const group = all.filter(([, e]) => (e.sport || "nfl") === sport);
      if (!group.length) {
        groups += dd(sport, name, "no bets yet", `<p class="lead">No bets yet.</p>`);
        continue;
      }
      const special = ["Game totals", "Other", "Parlays"];
      const teams = [...new Set(group.map(([, e]) => teamOf(e)))];
      const order = teams.filter((t) => !special.includes(t)).sort().concat(special.filter((t) => teams.includes(t)));
      const rank = { won: 0, lost: 1, push: 2, pending: 3 };
      const body = order.map((team) => {
        const ofTeam = group.filter(([, e]) => teamOf(e) === team);
        const ws = [...new Set(ofTeam.map(([, e]) => weekOf(e)))].sort((a, b) => (b ?? -1) - (a ?? -1));
        const inner = ws.map((w) => {
          const list = ofTeam.filter(([, e]) => weekOf(e) === w)
            .sort((a, b) => rank[a[2]] - rank[b[2]] || first(a[1]).localeCompare(first(b[1])));
          return `<div class="wk">${w ? "Week " + w : "Other"}<span>${tally(list)}</span></div><div>${list.map(([, e, s]) => histRow(e, s)).join("")}</div>`;
        }).join("");
        return dd(sport + "/" + team, team, tally(ofTeam), inner);
      }).join("");
      groups += dd(sport, name, tally(group), body);
    }
    return html + `<div>${groups}</div>`;
  }
  function reportCardHtml() {
    const r = DATA.report;
    let html = "";
    const clv = DATA.clv || {};  // beat the closing line (NFL)
    if (Object.keys(clv).length) {
      html += `<div class="rows3"><i>Beat the closing line (NFL)</i>` + Object.entries(clv).map(([k, [n, beat, avg]]) =>
        `<div><b>${k === "moneyline" ? "Moneylines" : "Spreads"}</b><span class="${beat / n >= 0.5 ? "c-good" : "c-bad"}">beat it ${beat} of ${n} (${pct(beat / n)})</span><span>average ${k === "moneyline" ? (avg * 100 >= 0 ? "+" : "") + (avg * 100).toFixed(1) + " chance points" : (avg >= 0 ? "+" : "") + avg.toFixed(1) + " points"}</span></div>`).join("") + `</div>`;
    }
    if (!r || !(r.tier.length || r.type.length || r.parlays.length)) return html || `<p class="lead">No settled bets yet.</p>`;
    for (const [key, title] of [["tier", "By confidence"], ["type", "By bet type"], ["parlays", "Parlays"]]) {
      if (!r[key].length) continue;
      html += `<div class="rows3"><i>${title}</i>` + r[key].map(([name, won, n, exp, act]) =>
        `<div><b>${esc(name)}</b><span class="${act >= exp - 0.05 ? "c-good" : "c-bad"}">won ${won} of ${n} (${pct(act)})</span><span>expected ${pct(exp)}${n < 10 ? " · too few to judge" : ""}</span></div>`).join("") + `</div>`;
    }
    return html;
  }
  function learnedHtml() {
    const learned = DATA.learned || [];
    if (!learned.length) return `<p class="lead">Nothing learned yet.</p>`;
    return `<div class="rows3">` + learned.map(([name, past, live, said, real]) =>
      `<div><b>${esc(name)}</b><span class="${real < said - 0.01 ? "c-bad" : real > said + 0.01 ? "c-good" : ""}">a ${pct(said)} bet really wins about ${pct(real)}</span><span>${[past ? past.toLocaleString() + " past bets" : "", live ? live + " graded this season" : ""].filter(Boolean).join(" · ")}</span></div>`).join("") + `</div>`;
  }
  // One line per bet: the result, the bet (and its league, week and team in search results), its chance.
  function histRow(e, status, meta) {
    const word = { won: "WON", lost: "LOST", push: "PUSH", pending: "OPEN" }[status];
    const legs = e.legs.map((l) => esc(l.pick));
    const title = e.kind === "single" ? legs[0] : `${legs.length}-leg parlay`;
    const sub = [e.kind === "single" ? "" : legs.join(" · "), (meta || []).filter(Boolean).map(esc).join(" · "),
      e.model ? "Model line: may not have been on FanDuel (not in the record)" : ""].filter(Boolean);
    return `<div class="hrow"><span class="res r-${status}">${word}</span><div class="what"><span class="t">${title}</span>${sub.map((x) => `<span class="s">${x}</span>`).join("")}</div><span class="num">${pct(e.prob)}</span></div>`;
  }
  function startDb(tries = 0) {
    if (!(window.claude && typeof window.claude.use === "function")) {
      if (tries < 10) setTimeout(() => startDb(tries + 1), 300);
      else { state.dbState = "off"; render(); }
      return;
    }
    window.claude.use("db").then((d) => {
      db = d;
      if (!db) { state.dbState = "off"; render(); return; }
      db.collection("checks").onSnapshot((snap) => {
        state.checks = {};
        snap.docs.forEach((d) => { const v = d.data(); state.checks[v.key] = v.on; });
        render();
      }, () => {});
      db.collection("placed").onSnapshot((snap) => {
        state.placed = snap.docs.map((d) => ({ docId: d.id, ...d.data() }));
        state.dbState = "on"; render();
      }, () => { state.dbState = "error"; render(); });
    }, () => { state.dbState = "off"; render(); });
  }

  // ---- what the numbers mean, one collapsed panel under the list
  function helpHtml(wk) {
    const fd = DATA.oddsNote && wk.singles.some((b) => b.fd);
    const item = (k, v) => `<dt>${k}</dt><dd>${v}</dd>`;
    let dl = item("Chance", `the chance the bet wins. <span class="c-good">Green</span> is 72% or more, <span class="c-warn">amber</span> under 62%.`);
    dl += item("Odds", fd ? "FanDuel's price where FanDuel posts the bet, otherwise the worst price still worth taking" : "the worst price still worth taking at that chance");
    dl += item("Pays", "what a $10 wager returns if it wins, stake included");
    if (state.sport === "nfl" || state.sport === "ncaaf") {
      dl += item(`<span class="dot" style="background:var(--good)"></span><span class="dot" style="background:var(--warn)"></span><span class="dot" style="background:var(--bad)"></span>`, "confidence tier: Strong, Mixed or Weak (open a bet to see why)");
      dl += item("Won 4 of 5", "how often this exact bet won in games already played");
      dl += item("Vs opponent", "the team's record against this week's opponent since 2024");
      dl += item("⚠", "a warning: injury, QB change, travel or head-to-head");
    }
    dl += item(`<span class="tag warn" style="margin:0">Confirm line</span>`, "the model's line: check FanDuel has it before you bet");
    dl += item(`<span class="tag warn" style="margin:0">Q</span> <span class="tag bad" style="margin:0">DNP</span>`, "questionable, or missed practice");
    let foot;
    if (fd) foot = "Bets with a FanDuel price show FanDuel's real price, and their chance is the true chance from every other sportsbook (each book's price with its cut taken out, sharp books counting most), so value is what $1 at FanDuel's price earns on average. Bets without a FanDuel price show break-even odds instead. Parlays priced at FanDuel multiply the legs' prices; FanDuel's slip may differ a little. Parlays have at most 3 legs: FanDuel's cut comes off every leg.";
    else if (state.sport === "mlb") foot = "MLB chances are DraftKings' lines with the sportsbook's cut taken out (our model only fills in games marked No line yet), so a FanDuel price better than the worst odds has positive expected value. All bets shows moneylines and run lines (FanDuel always offers the run line at 1.5). Total runs uses DraftKings' total, marked Confirm line.";
    else if (state.sport === "nba") foot = "NBA chances are DraftKings' lines with the sportsbook's cut taken out (our model only fills in games marked No line yet), so a FanDuel price better than the worst odds has positive expected value. All bets shows moneylines, which FanDuel always offers. Spread and Total points use DraftKings' line, marked Confirm line: FanDuel's can sit half a point away.";
    else if (state.sport === "ufc") foot = "UFC odds are break-even at the model's chance, not FanDuel's prices: a FanDuel price better than the worst odds has positive expected value. UFC bets are each fight's moneyline and whether it goes the distance (all scheduled rounds). Parlay chances assume different fights are independent.";
    else foot = "Odds are break-even, from public consensus lines and game logs, not FanDuel's prices: a FanDuel price better than the worst odds has positive expected value. All bets shows only moneylines and anytime touchdown scorers for starters, which are always on FanDuel. Other bet types come from the model at lines FanDuel may not offer, so they're marked Confirm line. Parlay chances assume legs from different games are independent.";
    return `<details class="help" data-dd="help"${state.open.has("help") ? " open" : ""}><summary>What the numbers mean</summary><dl>${dl}</dl><p>${foot}</p></details>`;
  }
  function notesHtml(wk) {
    const items = [];
    if (/no lines yet/.test(wk.label)) items.push(["alert", "No betting lines yet for this week. These come from the stats model alone, which is less reliable than market lines. They'll update once lines post."]);
    else if (wk.note) items.push(["", wk.note + "."]);
    if (wk.late) items.push(["alert", wk.late + "."]);
    if (DATA.oddsNote && wk.singles.some((b) => b.fd)) items.push(["ok", DATA.oddsNote]);
    else if (wk.modelNote) items.push(["", wk.modelNote]);
    if (wk.starters) items.push(["", "Starters: " + wk.starters]);
    return items.length ? `<ul class="notes">${items.map(([c, t]) => `<li class="${c}">${esc(t)}</li>`).join("")}</ul>` : "";
  }

  function render() {
    const wk = current();
    document.querySelectorAll(".leagues button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.sport === state.sport)));
    $("week").innerHTML = weekList().map((w) => `<option value="${w.week}"${w.week === wk.week ? " selected" : ""}>${esc(w.label)}</option>`).join("");
    $("updated").textContent = DATA.updated;
    $("btype").innerHTML = typeOptions(weekData());
    document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
    const n = (id, v) => { $(id).textContent = v === "" ? "" : String(v); };
    n("n-singles", wk.singles.length);
    n("n-parlays", wk.parlays.length);
    n("n-money", (wk.money || []).length);
    n("n-multi", (DATA.multi || []).length);
    n("n-value", (((DATA.value || {})[state.sport]) || []).length || "");
    n("n-injuries", wk.injuries ? wk.injuries.players.length : "");
    n("n-history", historyList().length);

    const betTabs = ["singles", "parlays", "money", "multi"];
    let html = ["singles", "parlays", "money"].includes(state.tab) ? notesHtml(wk) : "";
    const fdParl = (list) => (list.some((p) => fdDecimal(p)) ? "Odds" : "Worst odds");
    const ups = (list) => { const n = list.filter((x) => x.worth && x.worth[0]).length; return `<p class="lead">👍 ${n} of ${list.length} worth betting at FanDuel's price. Thumbs down means not worth it, or not sure (no FanDuel price to check, a doubtful price, an uncertain player or Weak signals). Tap a bet to see why.</p>`; };
    const singlesLead = (state.betType === "All bets" ? `<p class="lead">Bets at ${pct(DATA.singleMin || 0.7)} or better, likeliest first. Pick a bet type to see every bet of that type.</p>` : "") + ups(wk.singles);
    const parlayLead = DATA.singlesNote ? `<p class="lead" style="color:var(--fg)">${esc(DATA.singlesNote)}</p>` : "";
    if (state.tab === "singles") html += wk.singles.length
      ? singlesLead + `<div class="list">${listHead(wk.singles.some((b) => b.fd) ? "Odds" : "Worst odds")}${wk.singles.map(singleRow).join("")}</div>`
      : `<p class="empty">${esc(emptyNote(`No bets at ${pct(DATA.singleMin || 0.7)} or better here. Pick a bet type to see every bet of that type.`))}</p>`;
    if (state.tab === "parlays") html += wk.parlays.length
      ? parlayLead + ups(wk.parlays) + `<p class="lead">Each parlay pays at least $40 on a $10 wager, likeliest first.${wk.poolNote ? " " + esc(wk.poolNote) : ""}</p><div class="list">${listHead(fdParl(wk.parlays))}${wk.parlays.map((p, i) => parlayRow(p, i, "P")).join("")}</div>`
      : `<p class="empty">${esc(emptyNote("Not enough games for a parlay this week."))}</p>`;
    if (state.tab === "money") html += (wk.money || []).length
      ? parlayLead + ups(wk.money) + `<p class="lead">The likeliest parlays that at least double your $10 if they win, even at FanDuel's prices: ${(DATA.moneyLegs || [2, 3]).join("–")} legs from different games. Parlays whose every leg has won at least 75% of the time come first. No Weak legs, and no leg in more than two. Payouts marked ≈ are estimates; check the slip.</p><div class="list">${listHead(fdParl(wk.money))}${wk.money.map((p, i) => parlayRow(p, i, "M", true)).join("")}</div>`
      : `<p class="empty">No money makers here: not enough games this week.</p>`;
    if (state.tab === "multi") html += (DATA.multi || []).length
      ? parlayLead + ups(DATA.multi) + `<p class="lead">Parlays with legs from at least two leagues (NFL, college, UFC, MLB, NBA): ${(DATA.multiLegs || [2, 3]).join("–")} legs from different games, each paying at least $40 on $10, likeliest first. They're the same whichever league is picked.</p><div class="list">${listHead(fdParl(DATA.multi))}${DATA.multi.map((p, i) => parlayRow(p, i, "X")).join("")}</div>`
      : `<p class="empty">No Multi-Lays right now: fewer than two leagues have games.</p>`;
    if (state.tab === "value") html += valueView();
    if (state.tab === "injuries") html += injuriesView(wk);
    if (state.tab === "history") html += historyView();
    if (betTabs.includes(state.tab) || state.tab === "value") html += helpHtml(wk);
    $("main").innerHTML = html;
  }

  document.addEventListener("click", (e) => {
    const t = e.target.closest("button");
    if (!t) return;
    if (t.dataset.sport) {
      state.sport = t.dataset.sport; store.set("bb.sport", state.sport);
      const kinds = (DATA.leagueTypes || {})[state.sport];
      if (kinds && !kinds.includes(state.betType)) state.betType = "All bets";
      render();
    }
    else if (t.dataset.tab) { state.tab = t.dataset.tab; store.set("bb.tab", state.tab); render(); }
    else if (t.dataset.hclear) { state.hist = { ...HF }; render(); }
    else if (t.dataset.inj) { state.injFilter = t.dataset.inj; render(); }
  });
  $("week").addEventListener("change", (e) => { state.week[state.sport] = +e.target.value; render(); });
  $("btype").addEventListener("change", (e) => { state.betType = e.target.value; store.set("bb.type", state.betType); render(); });
  document.addEventListener("change", (e) => {
    const k = e.target.dataset && e.target.dataset.hf;
    if (k) { state.hist[k] = e.target.value; render(); }
    if (e.target.id === "hmodel") { state.showModel = e.target.checked; render(); }
  });
  // Open rows and dropdowns stay open across redraws.
  document.addEventListener("toggle", (e) => {
    const d = e.target;
    if (d.dataset && d.dataset.dd) { if (d.open) state.open.add(d.dataset.dd); else state.open.delete(d.dataset.dd); }
  }, true);
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id !== "hsearch" && t.id !== "injsearch") return;
    if (t.id === "hsearch") state.hist.q = t.value; else state.injSearch = t.value;
    render();
    const s = $(t.id); s.focus(); s.setSelectionRange(s.value.length, s.value.length);
  });
  render();
  startDb();
})();
</script>
