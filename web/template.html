<title>Bet Builder by Levi Shoaf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy sportsbook header over a charcoal field; white bet cards in a responsive grid; slip bar pinned to the bottom. Single committed dark look (the user's charcoal choice). */
:root {
  color-scheme: dark;
  --field: #2b2b2e;
  --field-2: #252528;
  --navy: #0c1b33;
  --navy-2: #13284a;
  --blue: #1677ff;
  --blue-soft: #e8f1ff;
  --card: #ffffff;
  --ink: #111827;
  --ink-2: #4b5563;
  --line: #e5e7eb;
  --on-dark: #f3f4f6;
  --on-dark-2: #a8adb7;
  --mark: #8a93a3;
  --good: #128a4a;
  --good-soft: #e3f5ea;
  --warn: #b7791f;
  --warn-soft: #fdf3dc;
  --bad: #c62828;
  --bad-soft: #fde7e7;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
body {
  background:
    repeating-linear-gradient(90deg, var(--field) 0 80px, var(--field-2) 80px 160px);
  color: var(--on-dark);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.4;
  font-variant-numeric: tabular-nums;
  padding-bottom: 96px;
}
button, input, select { font: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.top { position: relative; background: var(--navy); border-bottom: 3px solid var(--blue); }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; }
.bar1 { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 14px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: .02em; text-transform: uppercase; margin: 0; }
.brand span { color: var(--blue); }
.seg { display: inline-flex; background: var(--navy-2); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--on-dark-2); padding: 6px 16px; border-radius: 999px; font-weight: 700; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--blue); color: #fff; }
.weeksel { background: var(--navy-2); color: var(--on-dark); border: 1px solid #2a4170; border-radius: 8px; padding: 7px 10px; font-weight: 600; max-width: 100%; }
.updated { margin-left: auto; color: var(--on-dark-2); font-size: 13px; }
.updated b { color: var(--on-dark); font-weight: 600; }

.bar2 { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding-block: 0 12px; color: var(--on-dark-2); font-size: 13px; }
.bar2 label { display: inline-flex; align-items: center; gap: 6px; }
.bar2 input { width: 72px; background: var(--navy-2); color: var(--on-dark); border: 1px solid #2a4170; border-radius: 6px; padding: 4px 8px; }

.tabs { display: flex; gap: 4px; overflow-x: auto; }
.tabs button { border: 0; background: transparent; color: var(--on-dark-2); padding: 10px 14px; font-weight: 700; font-family: var(--display); font-size: 17px; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -3px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: #fff; border-bottom-color: #fff; }
.count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: var(--navy-2); color: var(--on-dark); font-family: var(--body); font-size: 12px; line-height: 20px; text-align: center; }

main { padding-block: 18px; display: grid; gap: 14px; }
/* Owner watermark: small, straight, top-right corner of the header. */
.watermark { position: absolute; top: 4px; right: 10px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--mark); pointer-events: none; user-select: none; }
.notice { background: rgba(12, 27, 51, .85); border: 1px solid #2a4170; border-radius: 10px; padding: 10px 14px; color: var(--on-dark); font-size: 14px; }
.notice strong { color: #fff; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }

.card { background: var(--card); color: var(--ink); border-radius: 10px; padding: 9px 10px; display: grid; gap: 6px; cursor: pointer; border: 2px solid transparent; text-align: left; width: 100%; min-width: 0; }
.card:hover { border-color: #bcd4ff; }
.card.on { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(22, 119, 255, .25); }
.row { display: flex; align-items: flex-start; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.rank { font-family: var(--display); font-weight: 700; color: var(--ink-2); font-size: 13px; }
.mkt { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.pick { font-weight: 700; font-size: 14px; line-height: 1.2; overflow-wrap: anywhere; }
.game { color: var(--ink-2); font-size: 11.5px; overflow-wrap: anywhere; }
.odds { flex: none; background: var(--blue-soft); color: var(--blue); border-radius: 7px; padding: 3px 7px; text-align: center; min-width: 58px; }
.odds b { display: block; font-family: var(--display); font-size: 16px; line-height: 1.1; }
.odds small { font-size: 9px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.card.on .odds { background: var(--blue); color: #fff; }
.meter { display: flex; align-items: center; gap: 10px; }
.track { flex: 1; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.fill { height: 100%; border-radius: 3px; }
.pct { font-family: var(--display); font-weight: 800; font-size: 15px; min-width: 36px; text-align: right; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; border-top: 1px solid var(--line); padding-top: 5px; font-size: 10.5px; color: var(--ink-2); }
.stats b { display: block; color: var(--ink); font-size: 12px; }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; }
.b-q { background: var(--warn-soft); color: var(--warn); }
.b-dnp { background: var(--bad-soft); color: var(--bad); }
.legs { display: grid; gap: 5px; margin: 0; padding: 0; list-style: none; }
.legs li { display: flex; gap: 8px; align-items: baseline; border-left: 3px solid var(--line); padding-left: 8px; }
.legs .lp { font-weight: 700; font-size: 12px; min-width: 30px; color: var(--ink-2); }

.empty { color: var(--on-dark-2); padding: 18px; border: 1px dashed #555; border-radius: 10px; }

.inj-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.inj-tools input { background: var(--card); color: var(--ink); border: 0; border-radius: 8px; padding: 8px 12px; width: min(280px, 100%); }
.chip { border: 1px solid #555; background: transparent; color: var(--on-dark); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--on-dark); color: var(--navy); border-color: var(--on-dark); }
.inj-game { background: var(--card); color: var(--ink); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.inj-game h3 { margin: 0 0 8px; font-family: var(--display); font-size: 18px; letter-spacing: .02em; }
.inj-game h3 small { font-family: var(--body); font-weight: 500; color: var(--ink-2); font-size: 13px; margin-left: 6px; }
.inj { display: grid; grid-template-columns: 74px 1fr auto; gap: 8px; align-items: center; padding: 5px 0; border-top: 1px solid var(--line); font-size: 14px; }
.status { font-size: 11px; font-weight: 700; text-align: center; border-radius: 6px; padding: 3px 4px; text-transform: uppercase; letter-spacing: .03em; }
.s-out { background: var(--bad); color: #fff; }
.s-doubtful { background: var(--bad-soft); color: var(--bad); }
.s-questionable { background: var(--warn-soft); color: var(--warn); }
.s-dnp { background: #f1e4ff; color: #6b2bb5; }
.s-limited { background: var(--line); color: var(--ink-2); }
.inj .who { min-width: 0; overflow-wrap: anywhere; }
.inj .who small { color: var(--ink-2); }
.inj .what { color: var(--ink-2); font-size: 13px; text-align: right; }
.official { font-size: 11px; color: var(--good); font-weight: 700; }

.slip { display: grid; gap: 10px; }
.pill { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; padding: 2px 7px; border-radius: 5px; color: #fff; vertical-align: 1px; }
.p-won { background: var(--good); }
.p-lost { background: var(--bad); }
.p-push { background: #8a93a3; }
.p-pending { background: var(--blue); }
.rgrid { align-items: start; }
.hist-section { display: grid; gap: 10px; }
.hist-head { margin: 8px 0 0; font-family: var(--display); font-size: 24px; letter-spacing: .03em; text-transform: uppercase; color: #fff; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; border-bottom: 2px solid var(--blue); padding-bottom: 4px; }
.hist-head span { font-family: var(--body); font-size: 13px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--on-dark-2); }
.rlegs { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.rlegs li { display: grid; grid-template-columns: 18px 1fr; gap: 6px; font-size: 12.5px; }
.rlegs .mk { font-weight: 800; text-align: center; }
.mk-won { color: var(--good); } .mk-lost { color: var(--bad); } .mk-push, .mk-pending { color: var(--ink-2); }
.rfoot { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 6px; font-size: 12px; font-weight: 600; }
.summary { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.summary b { font-size: 16px; color: #fff; }
.placerow { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--ink-2); border-top: 1px dashed var(--line); padding-top: 7px; }
.placerow input { width: 72px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px; color: var(--ink); background: #fff; }
.placerow .btn { padding: 5px 12px; font-size: 12.5px; }
.placed-ok { color: var(--good); font-weight: 700; }
.slip-item { background: var(--card); color: var(--ink); border-radius: 10px; padding: 9px 12px; display: grid; gap: 6px; }
.check { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-2); }
.check input { width: 90px; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; color: var(--ink); background: #fff; }
.verdict { font-weight: 700; }
.v-good { color: var(--good); }
.v-bad { color: var(--bad); }
.x { border: 0; background: transparent; color: var(--ink-2); cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: underline; }

.slipbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--navy); border-top: 3px solid var(--blue); padding-bottom: env(safe-area-inset-bottom, 0px); }
.slipbar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 12px; }
.slipbar .sum { flex: 1; min-width: 0; font-size: 14px; color: var(--on-dark); }
.btn { border: 0; border-radius: 999px; padding: 9px 18px; font-weight: 700; cursor: pointer; }
.btn-primary { background: var(--blue); color: #fff; }
.btn-ghost { background: transparent; color: var(--on-dark); border: 1px solid #2a4170; }
.foot { color: var(--on-dark-2); font-size: 12.5px; max-width: 70ch; }
@media (max-width: 520px) {
  .updated { margin-left: 0; width: 100%; }
  .grid { grid-template-columns: 1fr; }
  .inj { grid-template-columns: 66px 1fr; }
  .inj .what { grid-column: 2; text-align: left; }
}
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .12s, box-shadow .12s; } }
</style>

<header class="top">
  <div class="watermark" aria-hidden="true">Levi Shoaf</div>
  <div class="wrap">
    <div class="bar1">
      <h1 class="brand">Bet <span>Builder</span></h1>
      <div class="seg" role="group" aria-label="League">
        <button id="sport-nfl" data-sport="nfl" aria-pressed="true">NFL</button>
        <button id="sport-ncaaf" data-sport="ncaaf" aria-pressed="false">College</button>
      </div>
      <select id="week" class="weeksel" aria-label="Games"></select>
      <div class="updated">Updated <b id="updated"></b></div>
    </div>
    <div class="bar2">
      <label for="wager">Wager $ <input id="wager" type="number" min="1" step="1" value="100"></label>
      <span>Bets with a 60–80% chance, likeliest first. Tap a bet to add it to your slip.</span>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-singles" data-tab="singles" aria-selected="true">Single bets<span class="count" id="n-singles"></span></button>
      <button role="tab" id="tab-parlays" data-tab="parlays" aria-selected="false">Parlays<span class="count" id="n-parlays"></span></button>
      <button role="tab" id="tab-injuries" data-tab="injuries" aria-selected="false">Injuries<span class="count" id="n-injuries"></span></button>
      <button role="tab" id="tab-slip" data-tab="slip" aria-selected="false">Your slip<span class="count" id="n-slip"></span></button>
      <button role="tab" id="tab-placed" data-tab="placed" aria-selected="false">Placed<span class="count" id="n-placed"></span></button>
      <button role="tab" id="tab-unplaced" data-tab="unplaced" aria-selected="false">Not placed<span class="count" id="n-unplaced"></span></button>
      <button role="tab" id="tab-history" data-tab="history" aria-selected="false">Bet History<span class="count" id="n-history"></span></button>
    </nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="slipbar">
  <div class="wrap">
    <div class="sum" id="slipsum">Your slip is empty.</div>
    <button class="btn btn-primary" id="viewslip">View slip</button>
    <button class="btn btn-ghost" id="clearslip">Clear</button>
  </div>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const state = {
    sport: store.get("bb.sport", "nfl"),
    week: {},
    tab: store.get("bb.tab", "singles"),
    slip: store.get("bb.slip", []),       // [{kind, id, ...snapshot}]
    prices: store.get("bb.prices", {}),
    injFilter: "all",
    injSearch: ""
  };
  if (!DATA[state.sport] || !DATA[state.sport].length) state.sport = "nfl";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pct = (p) => Math.round(p * 100) + "%";
  const money = (x) => "$" + (x >= 1000 ? x.toLocaleString("en-US", { maximumFractionDigits: 0 }) : (Number.isInteger(x) ? String(x) : x.toFixed(2)));
  const wager = () => Math.max(1, Number($("wager").value) || 100);
  const amToDec = (a) => (a > 0 ? 1 + a / 100 : 1 + 100 / -a);
  const fmtAm = (a) => (a > 0 ? "+" : "") + a;
  const decToAm = (d) => (d >= 2 ? Math.round((d - 1) * 100) : Math.round(-100 / (d - 1)));
  const color = (p) => (p >= 0.72 ? "var(--good)" : p >= 0.62 ? "var(--blue)" : "var(--warn)");

  function weekList() { return DATA[state.sport] || []; }
  function current() {
    const list = weekList();
    const w = state.week[state.sport];
    return list.find((x) => x.week === w) || list[0] || { singles: [], parlays: [], label: "" };
  }
  function parlayId(p) { return "P:" + p.legs.map((l) => l.id).join(" | "); }
  function inSlip(id) { return state.slip.some((s) => s.id === id); }
  function save() { store.set("bb.slip", state.slip); store.set("bb.prices", state.prices); }

  function statRow(prob) {
    const w = wager();
    return `<div class="stats">
      <div>To win<b>${pct(prob)}</b></div>
      <div>Payout*<b>${money(w / prob)}</b></div>
      <div>Worst odds<b>${fmtAm(decToAm(1 / prob))}</b></div>
    </div>`;
  }
  function meter(p) {
    return `<div class="meter"><div class="track"><div class="fill" style="width:${(p * 100).toFixed(1)}%;background:${color(p)}"></div></div><span class="pct" style="color:${color(p)}">${pct(p)}</span></div>`;
  }
  function badge(note) {
    if (note === "Questionable") return '<span class="badge b-q">Q</span>';
    if (note === "Did not practice") return '<span class="badge b-dnp">DNP</span>';
    return "";
  }

  function singleCard(b, i) {
    return `<button class="card${inSlip(b.id) ? " on" : ""}" data-single="${i}" aria-pressed="${inSlip(b.id)}">
      <div class="row">
        <span class="rank">${i + 1}</span>
        <div class="grow">
          <div class="mkt">${esc(b.market)}</div>
          <div class="pick">${esc(b.label)}${badge(b.note)}</div>
          <div class="game">${esc(b.game)} · ${esc(b.when)} ET</div>
        </div>
        <div class="odds"><b>${esc(b.breakeven)}</b><small>break-even</small></div>
      </div>
      ${meter(b.prob)}
      ${statRow(b.prob)}
    </button>`;
  }
  function parlayCard(p, i) {
    const id = parlayId(p);
    return `<button class="card${inSlip(id) ? " on" : ""}" data-parlay="${i}" aria-pressed="${inSlip(id)}">
      <div class="row">
        <div class="grow"><div class="mkt">Parlay ${i + 1} · ${p.legs.length} legs</div></div>
        <div class="odds"><b>${esc(p.breakeven)}</b><small>break-even</small></div>
      </div>
      <ul class="legs">${p.legs.map((l) => `<li><span class="lp">${pct(l.prob)}</span><div class="grow"><div class="pick" style="font-size:12.5px">${esc(l.label)}${badge(l.note)}</div><div class="game">${esc(l.game)} · ${esc(l.when)}</div></div></li>`).join("")}</ul>
      ${meter(p.prob)}
      ${statRow(p.prob)}
    </button>`;
  }

  const SEV = ["Out", "Doubtful", "Questionable", "Did not practice", "Limited"];
  const SCLS = { Out: "s-out", Doubtful: "s-doubtful", Questionable: "s-questionable", "Did not practice": "s-dnp", Limited: "s-limited" };
  const SSHORT = { "Did not practice": "DNP" };
  function injuriesView(wk) {
    const inj = wk.injuries;
    if (!inj) return `<div class="empty">Injury reports are for NFL games. Switch to NFL to see them.</div>`;
    let players = inj.players;
    if (state.injFilter === "game") players = players.filter((p) => ["Out", "Doubtful", "Questionable"].includes(p.status));
    if (state.injFilter === "out") players = players.filter((p) => ["Out", "Doubtful"].includes(p.status));
    const q = state.injSearch.trim().toLowerCase();
    if (q) players = players.filter((p) => (p.player + " " + p.team_name + " " + p.team + " " + p.injury).toLowerCase().includes(q));
    const games = new Map();
    for (const p of players) {
      const home = p.opponent.startsWith("vs") ? p.team : p.opponent.slice(2);
      const away = p.opponent.startsWith("vs") ? p.opponent.slice(3) : p.team;
      const key = away + " @ " + home;
      if (!games.has(key)) games.set(key, { kickoff: p.kickoff, rows: [] });
      games.get(key).rows.push(p);
    }
    const when = (iso) => new Date(iso).toLocaleString("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "2-digit" });
    const blocks = [...games.entries()].sort((a, b) => a[1].kickoff.localeCompare(b[1].kickoff)).map(([k, g]) => `
      <section class="inj-game"><h3>${esc(k)}<small>${esc(when(g.kickoff))} ET</small></h3>
      ${g.rows.map((p) => `<div class="inj"><span class="status ${SCLS[p.status] || "s-limited"}">${esc(SSHORT[p.status] || p.status)}</span>
        <div class="who"><b>${esc(p.player)}</b> <small>${esc(p.position)} · ${esc(p.team)}</small>${p.official ? ' <span class="official">official</span>' : ""}</div>
        <div class="what">${esc(p.injury || "")}</div></div>`).join("")}</section>`).join("");
    return `<div class="notice">${esc(inj.note)}</div>
      <div class="inj-tools">
        <input id="injsearch" type="search" placeholder="Search player, team or injury" value="${esc(state.injSearch)}" aria-label="Search injuries">
        <button class="chip" data-inj="all" aria-pressed="${state.injFilter === "all"}">Everyone</button>
        <button class="chip" data-inj="game" aria-pressed="${state.injFilter === "game"}">Game statuses</button>
        <button class="chip" data-inj="out" aria-pressed="${state.injFilter === "out"}">Out or doubtful</button>
      </div>
      ${blocks ? `<div class="grid">${blocks}</div>` :
        state.injFilter !== "all" && !q && !inj.players.some((p) => p.official)
          ? `<div class="empty">No official game statuses yet. Out, Doubtful and Questionable come from the Friday injury report, which hadn't reached this data at the last update. Until then, use Everyone to see who missed or was limited in practice.</div>`
          : `<div class="empty">No players match.</div>`}`;
  }

  function verdict(prob, key) {
    const raw = state.prices[key];
    if (raw == null || raw === "") return `<span>Type FanDuel's odds to check the expected value.</span>`;
    const a = parseInt(String(raw).replace("+", ""), 10);
    if (!a || Math.abs(a) < 100) return `<span class="verdict v-bad">Enter odds like -150 or +240.</span>`;
    const ev = prob * amToDec(a) - 1;
    const w = wager();
    return `<span class="verdict ${ev > 0 ? "v-good" : "v-bad"}">${ev > 0 ? "Worth it" : "Not worth it"}: EV ${ev >= 0 ? "+" : ""}${(ev * 100).toFixed(1)}% (${ev >= 0 ? "+" : "−"}${money(Math.abs(ev * w))} per ${money(w)}), pays ${money(w * amToDec(a))}</span>`;
  }
  function checker(prob, key) {
    return `<div class="check"><label>FanDuel odds <input data-price="${esc(key)}" inputmode="numeric" placeholder="-150" value="${esc(state.prices[key] ?? "")}"></label><span data-verdict="${esc(key)}">${verdict(prob, key)}</span></div>`;
  }
  function combo() {
    const singles = state.slip.filter((s) => s.kind === "single");
    if (singles.length < 2) return null;
    if (new Set(singles.map((s) => s.game)).size !== singles.length) return { shared: true };
    return { prob: singles.reduce((a, s) => a * s.prob, 1), n: singles.length };
  }
  // ---- placed and not-placed bets, graded after the games
  const RESULTS = DATA.legResults || {};
  const HISTORY = DATA.history || [];
  const SAVED = DATA.saved || [];
  state.histFilter = "all";
  let db = null;
  state.placed = [];
  state.dbState = "loading";
  function entryId(kind, lids) { return kind + ":" + [...lids].sort().join(" + "); }
  function docId(s) {  // two FNV-1a hashes: a short id the store accepts
    let a = 0x811c9dc5, b = 0x01000193;
    for (let i = 0; i < s.length; i++) { a = Math.imul(a ^ s.charCodeAt(i), 16777619); b = Math.imul(b ^ s.charCodeAt(i), 2246822519); }
    return "b" + (a >>> 0).toString(16) + (b >>> 0).toString(16);
  }
  function legStatus(lid) { return RESULTS[lid] || ["pending", ""]; }
  function entryStatus(legs) {
    const s = legs.map((l) => legStatus(l.lid)[0]);
    if (s.includes("lost")) return "lost";
    if (s.includes("pending")) return "pending";
    return s.every((x) => x === "push") ? "push" : "won";
  }
  function profitOf(e, status) {
    if (status === "lost") return -e.stake;
    if (status !== "won") return 0;
    let dec = amToDec(e.odds);
    if (e.kind === "parlay") e.legs.forEach((l) => { if (legStatus(l.lid)[0] === "push") dec *= l.prob || 1; });
    return e.stake * (Math.max(dec, 1) - 1);
  }
  function placedIds() { return new Set(state.placed.map((p) => p.entryId)); }
  function unplaced() { const ids = placedIds(); return HISTORY.filter((h) => !ids.has(h.id)); }
  function summaryOf(entries, money_) {
    const st = entries.map((e) => [e, entryStatus(e.legs)]);
    const done = st.filter(([, s]) => s !== "pending");
    const pending = st.length - done.length;
    const tail = pending ? ` · ${pending} pending` : "";
    if (!done.length) return `No results yet${tail}`;
    const won = done.filter(([, s]) => s === "won").length, lost = done.filter(([, s]) => s === "lost").length;
    if (money_) {
      const net = done.reduce((a, [e, s]) => a + profitOf(e, s), 0), staked = done.reduce((a, [e]) => a + e.stake, 0);
      const pushed = done.length - won - lost;
      return `Record ${won}-${lost}${pushed ? "-" + pushed : ""} · profit ${net >= 0 ? "+" : "−"}${money(Math.abs(net))} on ${money(staked)}${tail}`;
    }
    const decided = done.filter(([, s]) => s !== "push");
    const expected = decided.reduce((a, [e]) => a + e.prob, 0) / (decided.length || 1);
    return `Hit ${won} of ${decided.length} (${pct(won / (decided.length || 1))}) · the builder expected ${pct(expected)}${tail}`;
  }
  const WORD = { won: "HIT", lost: "MISS", push: "PUSH", pending: "PENDING" };
  const MARK = { won: "✓", lost: "✗", push: "=", pending: "…" };
  const kickWhen = (iso) => !iso ? "" : new Date(iso).toLocaleString("en-US", { timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) + " ET";
  function resultCard(e, placed, tag) {
    const status = entryStatus(e.legs);
    const title = e.kind === "single" ? e.legs[0].pick : `${e.legs.length}-leg parlay`;
    const legs = e.legs.map((l) => {
      const [s, detail] = legStatus(l.lid);
      return `<li><span class="mk mk-${s}">${MARK[s]}</span><div>${e.kind === "parlay" ? `<b>${esc(l.pick)}</b><br>` : ""}<span class="game">${esc(l.game)} · ${esc(s !== "pending" && detail ? detail : kickWhen(l.kickoff))}</span></div></li>`;
    }).join("");
    let foot;
    const pre = tag ? `${esc(tag)} · ` : "";
    if (placed) {
      const net = profitOf(e, status);
      foot = `<span>${pre}${status === "pending" ? `${money(e.stake)} to win ${money(e.stake * (amToDec(e.odds) - 1))}` : `${money(e.stake)} staked · ${net >= 0 ? "+" : "−"}${money(Math.abs(net))}`}</span>${tag ? "" : `<button class="x" data-unplace="${esc(e.docId)}">Remove</button>`}`;
    } else {
      foot = `<span>${pre}Builder gave it ${pct(e.prob)} · ${esc((e.sport || "").toUpperCase())}</span>`;
    }
    return `<div class="card" style="cursor:default">
      <div class="row"><span class="pill p-${status}">${WORD[status]}</span><div class="grow pick">${esc(title)}</div><b style="color:var(--blue)">${esc(fmtAm(e.odds))}</b></div>
      <ul class="rlegs">${legs}</ul><div class="rfoot">${foot}</div></div>`;
  }
  function sortEntries(list) {
    const first = (e) => e.legs.map((l) => l.kickoff).sort()[0], last = (e) => e.legs.map((l) => l.kickoff).sort().pop();
    const pend = list.filter((e) => entryStatus(e.legs) === "pending").sort((a, b) => first(a).localeCompare(first(b)));
    const done = list.filter((e) => entryStatus(e.legs) !== "pending").sort((a, b) => last(b).localeCompare(last(a)));
    return pend.concat(done);
  }
  function trackedView(placed) {
    const list = placed ? state.placed : unplaced();
    const explain = placed
      ? "Bets you marked as placed from Your slip. Each one is graded after its games."
      : "Every pick the builder showed for the coming week that you didn't place, at the chance it had when first shown, and how it turned out.";
    let html = `<div class="notice summary"><div><b>${esc(summaryOf(list, placed))}</b><br>${explain}</div></div>`;
    if (placed && state.dbState === "off") return html + `<div class="empty">Placed bets need you signed in to claude.ai. Open this page from claude.ai to keep track of them.</div>`;
    if (placed && state.dbState === "error") return html + `<div class="empty">Couldn't load your placed bets. Reload the page to try again.</div>`;
    if (!list.length) return html + `<div class="empty">${placed ? "No placed bets yet. In Your slip, type the odds you got and tap I placed this." : "Nothing yet. Picks are logged for the week ahead as they're shown."}</div>`;
    const shown = sortEntries(list).slice(0, 80);
    html += `<div class="grid rgrid">${shown.map((e) => resultCard(e, placed)).join("")}</div>`;
    if (list.length > shown.length) html += `<p class="foot">Showing the latest ${shown.length} of ${list.length}.</p>`;
    return html + `<p class="foot">Results come in after each game (player stats usually the next morning) and appear when this page is next updated.</p>`;
  }
  function historyList() {  // [source, entry]: a pick you placed shows once, as placed
    const ids = placedIds();
    return state.placed.map((e) => ["Placed", e])
      .concat(unplaced().map((e) => ["Not placed", e]))
      .concat(SAVED.filter((e) => !ids.has(e.id)).map((e) => ["Saved earlier", e]));
  }
  function historyView() {
    const all = historyList().map(([src, e]) => [src, e, entryStatus(e.legs)]);
    const tally = (list) => {
      const c = { won: 0, lost: 0, push: 0, pending: 0 };
      list.forEach(([, , s]) => { c[s]++; });
      return `${c.won} won · ${c.lost} lost${c.push ? ` · ${c.push} pushed` : ""} · ${c.pending} pending`;
    };
    const placedOnes = all.filter(([src]) => src === "Placed").map(([, e]) => e);
    let html = `<div class="notice summary"><div><b>${tally(all)}</b><br>
      Every bet: ones you placed, the builder's picks you didn't, and bets saved earlier. Placed bets: ${esc(summaryOf(placedOnes, true))}.</div></div>`;
    const chip = (k, label) => `<button class="chip" data-hist="${k}" aria-pressed="${state.histFilter === k}">${label}</button>`;
    html += `<div class="inj-tools">${chip("all", "All")}${chip("won", "Won")}${chip("lost", "Lost")}${chip("pending", "Pending")}</div>`;
    const first = (e) => e.legs.map((l) => l.kickoff || "9999").sort()[0];
    for (const [sport, name] of [["nfl", "NFL"], ["ncaaf", "College football"]]) {
      const group = all.filter(([, e]) => (e.sport || "nfl") === sport);
      const list = state.histFilter === "all" ? group : group.filter(([, , s]) => s === state.histFilter);
      const done = list.filter(([, , s]) => s !== "pending").sort((a, b) => first(b[1]).localeCompare(first(a[1])));
      const pend = list.filter(([, , s]) => s === "pending").sort((a, b) => first(a[1]).localeCompare(first(b[1])));
      const shown = done.concat(pend).slice(0, 60);
      const placedHere = group.filter(([src]) => src === "Placed").map(([, e]) => e);
      html += `<section class="hist-section"><h2 class="hist-head">${name}<span>${tally(group)}${placedHere.length ? ` · placed: ${esc(summaryOf(placedHere, true))}` : ""}</span></h2>`;
      if (!shown.length) html += `<div class="empty">${group.length ? "None match this filter yet." : `No ${name} bets yet.`}</div>`;
      else html += `<div class="grid rgrid">${shown.map(([src, e]) => resultCard(e, src === "Placed", src)).join("")}</div>`;
      if (list.length > shown.length) html += `<p class="foot">Showing ${shown.length} of ${list.length}, settled bets first.</p>`;
      html += `</section>`;
    }
    return html + `<p class="foot">Results come in after each game (player stats usually the next morning) and appear when this page is next updated.</p>`;
  }
  function placeRow(key, legs, kind, prob) {
    if (!legs.every((l) => l.lid && l.rec)) return `<div class="placerow">This bet came from an older version of the page. Remove it and add it again to track it.</div>`;
    const eid = entryId(kind, legs.map((l) => l.lid));
    if (placedIds().has(eid)) return `<div class="placerow"><span class="placed-ok">✓ In your Placed bets</span></div>`;
    if (state.dbState === "off") return `<div class="placerow">Sign in to claude.ai to keep track of bets you place.</div>`;
    return `<div class="placerow"><label>Odds you got <input id="po-${key}" inputmode="numeric" placeholder="${esc(fmtAm(decToAm(1 / prob)))}"></label>
      <label>Stake $ <input id="ps-${key}" inputmode="decimal" value="${wager()}"></label>
      <button class="btn btn-primary" data-place="${key}">I placed this</button></div>`;
  }
  function slipEntry(key) {
    if (key === "combo") {
      const singles = state.slip.filter((s) => s.kind === "single");
      return { kind: "parlay", legs: singles, prob: singles.reduce((a, s) => a * s.prob, 1), sport: singles[0].sport };
    }
    const s = state.slip[+key];
    return s.kind === "single" ? { kind: "single", legs: [s], prob: s.prob, sport: s.sport } : { kind: "parlay", legs: s.legs, prob: s.prob, sport: s.sport };
  }
  function placeDoc(key) {  // the bet with that slip key as a placed-bet document, or a reason it can't be
    const e = slipEntry(key);
    const oddsText = ($("po-" + key)?.value || "").trim(), stake = parseFloat($("ps-" + key)?.value);
    const odds = oddsText ? parseInt(oddsText.replace("+", ""), 10) : decToAm(1 / e.prob);
    if (!odds || Math.abs(odds) < 100 || !(stake > 0)) return { error: "Odds look like -150 or +240, and the stake is a dollar amount." };
    const eid = entryId(e.kind, e.legs.map((l) => l.lid));
    return { id: docId(eid), doc: { entryId: eid, kind: e.kind, sport: e.sport || state.sport, prob: e.prob, odds, stake,
      placedAt: new Date().toISOString(),
      legs: e.legs.map((l) => ({ lid: l.lid, pick: l.label, game: l.game, kickoff: l.kickoff, prob: l.prob, rec: l.rec })) } };
  }
  function saveError(err) {
    return err && err.code === "invalid_argument" ? "This view can't save bets. Open the page as its owner." : "Couldn't save. Try again in a moment.";
  }
  async function placeBet(key) {
    const msg = $("placemsg"), d = placeDoc(key);
    if (d.error) { if (msg) msg.textContent = d.error; return; }
    try { await db.collection("placed").doc(d.id).set(d.doc); }
    catch (err) { if (msg) msg.textContent = saveError(err); }
  }
  async function placeAll() {
    const msg = $("placemsg");
    // Every slip bet that still shows an "I placed this" button (your singles as one parlay excluded).
    const keys = [...document.querySelectorAll("[data-place]")].map((b) => b.dataset.place).filter((k) => k !== "combo");
    if (!keys.length) { if (msg) msg.textContent = "Everything on your slip is already placed."; return; }
    const docs = keys.map(placeDoc);
    const bad = docs.find((d) => d.error);
    if (bad) { if (msg) msg.textContent = "Fix the odds or stake on one of the bets. " + bad.error; return; }
    let saved = 0;
    for (const d of docs) {  // one write at a time
      try { await db.collection("placed").doc(d.id).set(d.doc); saved++; }
      catch (err) { const m = $("placemsg"); if (m) m.textContent = `Placed ${saved} of ${docs.length}. ` + saveError(err); return; }
    }
    const total = docs.reduce((a, d) => a + d.doc.stake, 0);
    const m = $("placemsg"); if (m) m.textContent = `Placed ${saved} bet${saved === 1 ? "" : "s"}, ${money(total)} total.`;
  }
  function startDb(tries = 0) {
    if (!(window.claude && typeof window.claude.use === "function")) {
      if (tries < 10) setTimeout(() => startDb(tries + 1), 300);
      else { state.dbState = "off"; render(); }
      return;
    }
    window.claude.use("db").then((d) => {
      db = d;
      if (!db) { state.dbState = "off"; render(); return; }
      db.collection("placed").onSnapshot((snap) => {
        state.placed = snap.docs.map((d) => ({ docId: d.id, ...d.data() }));
        state.dbState = "on"; render();
      }, () => { state.dbState = "error"; render(); });
    }, () => { state.dbState = "off"; render(); });
  }

  function slipView() {
    if (!state.slip.length) return `<div class="empty">Nothing here yet. Tap any single bet or parlay to add it.</div>`;
    const items = state.slip.map((s, i) => `<div class="slip-item">
      <div class="row"><div class="grow">
        <div class="mkt">${s.kind === "single" ? esc(s.market) : "Parlay · " + s.legs.length + " legs"}</div>
        <div class="pick">${s.kind === "single" ? esc(s.label) : s.legs.map((l) => esc(l.label)).join("<br>")}</div>
        <div class="game">${s.kind === "single" ? esc(s.game) + " · " + esc(s.when) + " ET" : esc(s.weekLabel)}</div>
      </div><div class="odds"><b>${esc(s.breakeven)}</b><small>break-even</small></div></div>
      ${meter(s.prob)}${statRow(s.prob)}${checker(s.prob, s.id)}
      ${placeRow(i, s.kind === "single" ? [s] : s.legs, s.kind, s.prob)}
      <div><button class="x" data-remove="${i}">Remove from slip</button></div></div>`).join("");
    const c = combo();
    let extra = "";
    if (c && c.shared) extra = `<div class="notice">Two of your singles are from the same game, so they aren't combined into one parlay here (same-game legs move together).</div>`;
    else if (c) extra = `<div class="slip-item"><div class="mkt">Your ${c.n} singles as one parlay</div>${meter(c.prob)}${statRow(c.prob)}${checker(c.prob, "COMBO:" + state.slip.filter((s) => s.kind === "single").map((s) => s.id).join("|"))}${placeRow("combo", state.slip.filter((s) => s.kind === "single"), "parlay", c.prob)}</div>`;
    const allBtn = state.dbState === "on"
      ? `<div class="notice summary"><div><button class="btn btn-primary" data-placeall="1">Placed all</button> <span style="margin-left:8px">Marks every single and parlay below as placed, at the odds and stake next to each.</span></div></div>`
      : "";
    return `<div class="slip">${allBtn}<div id="placemsg" class="foot" role="status"></div>${extra}${items}</div>`;
  }

  function render() {
    const wk = current();
    document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.sport === state.sport)));
    const sel = $("week");
    sel.innerHTML = weekList().map((w) => `<option value="${w.week}"${w.week === wk.week ? " selected" : ""}>${esc(w.label)}</option>`).join("");
    $("updated").textContent = DATA.updated;
    document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
    $("n-singles").textContent = wk.singles.length;
    $("n-parlays").textContent = wk.parlays.length;
    $("n-injuries").textContent = wk.injuries ? wk.injuries.players.length : "–";
    $("n-slip").textContent = state.slip.length;
    $("n-placed").textContent = state.placed.length;
    $("n-unplaced").textContent = unplaced().length;
    $("n-history").textContent = historyList().length;

    let html = "";
    const future = /no lines yet/.test(wk.label);
    if (state.tab === "singles" || state.tab === "parlays") {
      if (future) html += `<div class="notice"><strong>No betting lines yet for this week.</strong> These come from the stats model alone, which is less reliable than market lines. They'll update once lines post.</div>`;
      else if (wk.note) html += `<div class="notice">${esc(wk.note)}.</div>`;
    }
    if (state.tab === "singles") html += wk.singles.length ? `<div class="grid">${wk.singles.map(singleCard).join("")}</div>` : `<div class="empty">No bets in the 60–80% range for this week.</div>`;
    if (state.tab === "parlays") html += wk.parlays.length ? `<div class="grid">${wk.parlays.map(parlayCard).join("")}</div>` : `<div class="empty">Not enough games for a parlay this week.</div>`;
    if (state.tab === "injuries") html += injuriesView(wk);
    if (state.tab === "slip") html += slipView();
    if (state.tab === "placed") html += trackedView(true);
    if (state.tab === "unplaced") html += trackedView(false);
    if (state.tab === "history") html += historyView();
    html += `<p class="foot">*Odds shown are break-even: the worst price still worth taking, from public consensus lines and game logs. They aren't FanDuel's prices, so expected value at these odds is zero. Type FanDuel's actual price into the slip to see the real expected value. Payout is what your wager returns at break-even odds, stake included. Worst odds is the lowest price still worth taking. Parlay chances assume legs from different games are independent.</p>`;
    $("main").innerHTML = html;

    const c = combo();
    const n = state.slip.length;
    $("slipsum").innerHTML = !n ? "Your slip is empty." :
      `<b>${n} pick${n > 1 ? "s" : ""}</b>` + (c && !c.shared ? ` · singles as one parlay: <b>${pct(c.prob)}</b> to win, break-even <b>${fmtAm(decToAm(1 / c.prob))}</b>, pays ${money(wager() / c.prob)} on ${money(wager())}` : "");
  }

  function toggle(entry) {
    const i = state.slip.findIndex((s) => s.id === entry.id);
    if (i >= 0) state.slip.splice(i, 1); else state.slip.push(entry);
    save(); render();
  }

  document.addEventListener("click", (e) => {
    const t = e.target.closest("button");
    if (!t) return;
    const wk = current();
    if (t.dataset.sport) { state.sport = t.dataset.sport; store.set("bb.sport", state.sport); render(); }
    else if (t.dataset.tab) { state.tab = t.dataset.tab; store.set("bb.tab", state.tab); render(); }
    else if (t.dataset.single) { const b = wk.singles[+t.dataset.single]; toggle({ kind: "single", sport: state.sport, ...b }); }
    else if (t.dataset.parlay) { const p = wk.parlays[+t.dataset.parlay]; toggle({ kind: "parlay", sport: state.sport, id: parlayId(p), legs: p.legs, prob: p.prob, breakeven: p.breakeven, weekLabel: (state.sport === "nfl" ? "NFL " : "College ") + wk.label.split(" · ")[0] }); }
    else if (t.dataset.hist) { state.histFilter = t.dataset.hist; render(); }
    else if (t.dataset.inj) { state.injFilter = t.dataset.inj; render(); }
    else if (t.dataset.remove) { state.slip.splice(+t.dataset.remove, 1); save(); render(); }
    else if (t.id === "viewslip") { state.tab = "slip"; render(); window.scrollTo({ top: 0 }); }
    else if (t.id === "clearslip") { state.slip = []; save(); render(); }
    else if (t.dataset.placeall) { placeAll(); }
    else if (t.dataset.place != null) { placeBet(t.dataset.place); }
    else if (t.dataset.unplace && db) { db.collection("placed").doc(t.dataset.unplace).delete().catch(() => {}); }
  });
  $("week").addEventListener("change", (e) => { state.week[state.sport] = +e.target.value; render(); });
  $("wager").addEventListener("input", render);
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.dataset && t.dataset.price != null) {
      state.prices[t.dataset.price] = t.value; save();
      const item = t.dataset.price.startsWith("COMBO:") ? combo() : state.slip.find((s) => s.id === t.dataset.price);
      const v = document.querySelector(`[data-verdict="${CSS.escape(t.dataset.price)}"]`);
      if (item && v) v.innerHTML = verdict(item.prob, t.dataset.price);
    } else if (t.id === "injsearch") {
      state.injSearch = t.value; render();
      const s = $("injsearch"); s.focus(); s.setSelectionRange(s.value.length, s.value.length);
    }
  });
  render();
  startDb();
})();
</script>
